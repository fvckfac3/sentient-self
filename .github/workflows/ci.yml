name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sentient
          POSTGRES_PASSWORD: sentient
          POSTGRES_DB: sentient_self
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentient"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://sentient:sentient@localhost:5432/sentient_self
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-secret-at-least-32-characters-long
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --ci

      - name: Check schema.prisma matches the migrations
        # Prisma resets the shadow database, so it gets its own
        run: |
          PGPASSWORD=sentient psql -h localhost -U sentient -d sentient_self -c 'CREATE DATABASE shadow'
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://sentient:sentient@localhost:5432/shadow \
            --exit-code

      - name: Apply migrations to a fresh database
        run: npm run db:deploy

      - name: Seed (twice, to prove it is re-runnable)
        run: npm run db:seed && npm run db:seed

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (desktop and mobile Chromium)
        run: npx playwright test --project=chromium --project="Mobile Chrome"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
